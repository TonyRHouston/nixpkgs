name: Labels
on:
  schedule:
  - cron: 07,17,27,37,47,57 * * * *
  workflow_call:
    inputs:
      headBranch:
        required: true
        type: string
    secrets:
      NIXPKGS_CI_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch: null
concurrency:
  group: labels-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number
    }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
permissions:
  issues: write
  pull-requests: write
defaults:
  run:
    shell: bash
jobs:
  update:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository_owner == 'NixOS'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        sparse-checkout: 'ci/github-script

          '
    - name: Install dependencies
      run: npm install @actions/artifact bottleneck
    - uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
      if: vars.NIXPKGS_CI_APP_ID
      id: app-token
      with:
        app-id: ${{ vars.NIXPKGS_CI_APP_ID }}
        private-key: ${{ secrets.NIXPKGS_CI_APP_PRIVATE_KEY }}
        permission-issues: write
        permission-pull-requests: write
    - name: Log current API rate limits
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: gh api /rate_limit | jq
    - name: Labels from API data and Eval results
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      with:
        github-token: ${{ steps.app-token.outputs.token || github.token }}
        retries: 3
        script: "require('./ci/github-script/labels.js')({\n  github,\n  context,\n\
          \  core,\n  dry: context.eventName == 'pull_request'\n})\n"
    - name: Log current API rate limits
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: gh api /rate_limit | jq
    - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9
      name: Labels from touched files
      if: 'github.event_name == ''pull_request_target'' &&

        !contains(fromJSON(inputs.headBranch).type, ''development'')

        '
      with:
        repo-token: ${{ steps.app-token.outputs.token }}
        configuration-path: .github/labeler.yml
        sync-labels: true
    - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9
      name: Labels from touched files (no sync)
      if: 'github.event_name == ''pull_request_target'' &&

        !contains(fromJSON(inputs.headBranch).type, ''development'')

        '
      with:
        repo-token: ${{ steps.app-token.outputs.token }}
        configuration-path: .github/labeler-no-sync.yml
        sync-labels: false
    - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9
      name: Labels from touched files (development branches)
      if: 'github.event_name == ''pull_request_target'' &&

        contains(fromJSON(inputs.headBranch).type, ''development'')

        '
      with:
        repo-token: ${{ steps.app-token.outputs.token }}
        configuration-path: .github/labeler-development-branches.yml
        sync-labels: true
    - name: Log current API rate limits
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: gh api /rate_limit | jq
