name: Labels
on:
  schedule:
  - cron: 07,17,27,37,47,57 * * * *
  workflow_call:
    inputs:
      headBranch:
        required: true
        type: string
    secrets:
      NIXPKGS_CI_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch: null
concurrency:
  group: labels-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number
    }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
permissions:
  issues: write
  pull-requests: write
defaults:
  run:
    shell: bash
jobs:
  update:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository_owner == 'NixOS'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        persist-credentials: false
        sparse-checkout: 'ci/github-script

          '
    - name: Install dependencies
      run: npm install @actions/artifact bottleneck
    - uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42
      if: github.event_name != 'pull_request' && vars.NIXPKGS_CI_APP_ID
      id: app-token
      with:
        app-id: ${{ vars.NIXPKGS_CI_APP_ID }}
        private-key: ${{ secrets.NIXPKGS_CI_APP_PRIVATE_KEY }}
        permission-issues: write
        permission-pull-requests: write
    - name: Log current API rate limits
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: gh api /rate_limit | jq
    - name: Labels from API data and Eval results
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        github-token: ${{ steps.app-token.outputs.token || github.token }}
        retries: 3
        script: "require('./ci/github-script/labels.js')({\n  github,\n  context,\n\
          \  core,\n  dry: context.eventName == 'pull_request'\n})\n"
    - name: Log current API rate limits
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: gh api /rate_limit | jq
    - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b
      name: Labels from touched files
      if: 'github.event_name == ''pull_request_target'' &&

        !contains(fromJSON(inputs.headBranch).type, ''development'')

        '
      with:
        repo-token: ${{ steps.app-token.outputs.token }}
        configuration-path: .github/labeler.yml
        sync-labels: true
    - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b
      name: Labels from touched files (no sync)
      if: 'github.event_name == ''pull_request_target'' &&

        !contains(fromJSON(inputs.headBranch).type, ''development'')

        '
      with:
        repo-token: ${{ steps.app-token.outputs.token }}
        configuration-path: .github/labeler-no-sync.yml
        sync-labels: false
    - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b
      name: Labels from touched files (development branches)
      if: 'github.event_name == ''pull_request_target'' &&

        contains(fromJSON(inputs.headBranch).type, ''development'')

        '
      with:
        repo-token: ${{ steps.app-token.outputs.token }}
        configuration-path: .github/labeler-development-branches.yml
        sync-labels: true
    - name: Log current API rate limits
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: gh api /rate_limit | jq
