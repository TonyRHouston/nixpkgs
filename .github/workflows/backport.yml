name: Backport
on:
  pull_request_target:
    types:
    - closed
    - labeled
permissions:
  contents: read
  issues: write
  pull-requests: write
defaults:
  run:
    shell: bash
jobs:
  backport:
    name: Backport Pull Request
    if: vars.NIXPKGS_CI_APP_ID && github.event.pull_request.merged == true && (github.event.action
      != 'labeled' || startsWith(github.event.label.name, 'backport'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf
      id: app-token
      with:
        app-id: ${{ vars.NIXPKGS_CI_APP_ID }}
        private-key: ${{ secrets.NIXPKGS_CI_APP_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write
        permission-workflows: write
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        token: ${{ steps.app-token.outputs.token }}
        persist-credentials: true
    - name: Log current API rate limits
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: gh api /rate_limit | jq
    - name: Create backport PRs
      id: backport
      uses: korthout/backport-action@c656f5d5851037b2b38fb5db2691a03fa229e3b2
      with:
        copy_labels_pattern: severity:\ssecurity
        github_token: ${{ steps.app-token.outputs.token }}
        pull_description: 'Bot-based backport to `${target_branch}`, triggered by
          a label in #${pull_number}.


          **Before merging, ensure that this backport is [acceptable for the release](https://github.com/NixOS/nixpkgs/blob/master/CONTRIBUTING.md#changes-acceptable-for-releases).**


          Even as a non-committer, if you find that it is not acceptable, leave a
          comment.


          > [!TIP]

          > If you maintain all packages touched by this pull request, and they are
          all located under `pkgs/by-name/*`, you can comment **`@NixOS/nixpkgs-merge-bot
          merge`** to automatically merge this PR using the [`nixpkgs-merge-bot`](https://github.com/NixOS/nixpkgs/blob/master/ci/README.md#nixpkgs-merge-bot).'
    - name: Log current API rate limits
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: gh api /rate_limit | jq
    - name: 'Add ''has: port to stable'' label'
      if: steps.backport.outputs.created_pull_numbers != ''
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        script: "await github.rest.issues.addLabels({\n  owner: context.repo.owner,\n\
          \  repo: context.repo.repo,\n  issue_number: context.payload.pull_request.number,\n\
          \  labels: [ '8.has: port to stable' ]\n})\n"
