name: Eval
on:
  workflow_call:
    inputs:
      artifact-prefix:
        required: true
        type: string
      mergedSha:
        required: true
        type: string
      targetSha:
        type: string
      systems:
        required: true
        type: string
      testVersions:
        required: false
        default: false
        type: boolean
    secrets:
      CACHIX_AUTH_TOKEN_GHA:
        required: false
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  versions:
    if: inputs.testVersions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
    - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      with:
        persist-credentials: false
        path: trusted
        sparse-checkout: 'ci/supportedVersions.nix

          '
    - name: Check out the PR at the test merge commit
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      with:
        persist-credentials: false
        ref: ${{ inputs.mergedSha }}
        path: untrusted
        sparse-checkout: 'ci/pinned.json

          '
    - name: Install Nix
      uses: cachix/install-nix-action@0b0e072294b088b73964f1d72dfdac0951439dbd
    - name: Load supported versions
      id: versions
      run: 'echo "versions=$(trusted/ci/supportedVersions.nix --arg pinnedJson untrusted/ci/pinned.json)"
        >> "$GITHUB_OUTPUT"

        '
  eval:
    runs-on: ubuntu-latest
    needs: versions
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
        version:
        - ''
        - ${{ fromJSON(needs.versions.outputs.versions || '[]') }}
    continue-on-error: ${{ matrix.version != '' }}
    name: ${{ matrix.system }}${{ matrix.version && format(' @ {0}', matrix.version)
      || '' }}
    timeout-minutes: 15
    steps:
    - name: Enable swap
      run: 'sudo fallocate -l 10G /swap

        sudo chmod 600 /swap

        sudo mkswap /swap

        sudo swapon /swap

        '
    - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      with:
        persist-credentials: false
        sparse-checkout: .github/actions
    - name: Check out the PR at merged and target commits
      uses: ./.github/actions/checkout
      with:
        merged-as-untrusted-at: ${{ inputs.mergedSha }}
        target-as-trusted-at: ${{ inputs.targetSha }}
    - name: Install Nix
      uses: cachix/install-nix-action@0b0e072294b088b73964f1d72dfdac0951439dbd
    - uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad
      continue-on-error: true
      with:
        name: ${{ vars.CACHIX_NAME || 'nixpkgs-gha' }}
        extraPullNames: nixpkgs-gha
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN_GHA }}
        pushFilter: (-source|-single-chunk)$
    - name: Evaluate the ${{ matrix.system }} output paths at the merge commit
      env:
        MATRIX_SYSTEM: ${{ matrix.system }}
        MATRIX_VERSION: ${{ matrix.version || 'nixVersions.latest' }}
      run: "nix-build nixpkgs/untrusted/ci --arg nixpkgs ./nixpkgs/untrusted-pinned\
        \ -A eval.singleSystem \\\n  --argstr evalSystem \"$MATRIX_SYSTEM\" \\\n \
        \ --arg chunkSize 8000 \\\n  --argstr nixPath \"$MATRIX_VERSION\" \\\n  --out-link\
        \ merged\n# If it uses too much memory, slightly decrease chunkSize.\n# Note:\
        \ Keep the same further down in sync!\n"
    - name: Evaluate the ${{ matrix.system }} output paths at the target commit
      env:
        MATRIX_SYSTEM: ${{ matrix.system }}
      run: "TARGET_DRV=$(nix-instantiate nixpkgs/trusted/ci --arg nixpkgs ./nixpkgs/trusted-pinned\
        \ -A eval.singleSystem \\\n  --argstr evalSystem \"$MATRIX_SYSTEM\" \\\n \
        \ --arg chunkSize 8000 \\\n  --argstr nixPath \"nixVersions.latest\")\n\n\
        # Try to fetch this from Cachix a few times, for up to 30 seconds. This avoids\
        \ running Eval\n# twice in the Merge Queue, when a later item finishes Eval\
        \ at the merge commit earlier.\nfor _i in {1..6}; do\n  # Using --max-jobs\
        \ 0 will cause nix-build to fail if this can't be substituted from cachix.\n\
        \  if nix-build \"$TARGET_DRV\" --max-jobs 0; then\n    break\n  fi\n  sleep\
        \ 5\ndone\n\n# Either fetches from Cachix or runs Eval itself. The fallback\
        \ is required\n# for pull requests into wip-branches without merge queue.\n\
        nix-build \"$TARGET_DRV\" --out-link target\n"
    - name: Compare outpaths against the target branch
      env:
        MATRIX_SYSTEM: ${{ matrix.system }}
      run: "nix-build nixpkgs/untrusted/ci --arg nixpkgs ./nixpkgs/untrusted-pinned\
        \ -A eval.diff \\\n  --arg beforeDir ./target \\\n  --arg afterDir ./merged\
        \ \\\n  --argstr evalSystem \"$MATRIX_SYSTEM\" \\\n  --out-link diff\n"
    - name: Upload outpaths diff and stats
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      with:
        name: ${{ inputs.artifact-prefix }}${{ matrix.version && format('{0}-', matrix.version)
          || '' }}diff-${{ matrix.system }}
        path: diff/*
  compare:
    runs-on: ubuntu-latest
    needs:
    - eval
    if: ${{ !cancelled() && !failure() }}
    permissions:
      statuses: write
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      with:
        persist-credentials: false
        sparse-checkout: .github/actions
    - name: Check out the PR at the target commit
      uses: ./.github/actions/checkout
      with:
        merged-as-untrusted-at: ${{ inputs.mergedSha }}
        target-as-trusted-at: ${{ inputs.targetSha }}
    - name: Download output paths and eval stats for all systems
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: ${{ inputs.artifact-prefix }}diff-*
        path: diff
        merge-multiple: true
    - name: Install Nix
      uses: cachix/install-nix-action@0b0e072294b088b73964f1d72dfdac0951439dbd
    - name: Combine all output paths and eval stats
      run: "nix-build nixpkgs/trusted/ci --arg nixpkgs ./nixpkgs/trusted-pinned -A\
        \ eval.combine \\\n  --arg diffDir ./diff \\\n  --out-link combined\n"
    - name: Upload the maintainer list
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      with:
        name: ${{ inputs.artifact-prefix }}maintainers
        path: combined/maintainers.json
    - name: Compare against the target branch
      env:
        TARGET_SHA: ${{ inputs.mergedSha }}
      run: "git -C nixpkgs/trusted diff --name-only \"$TARGET_SHA\" \\\n  | jq --raw-input\
        \ --slurp 'split(\"\\n\")[:-1]' > touched-files.json\n\n# Use the target branch\
        \ to get accurate maintainer info\nnix-build nixpkgs/trusted/ci --arg nixpkgs\
        \ ./nixpkgs/trusted-pinned -A eval.compare \\\n  --arg combinedDir ./combined\
        \ \\\n  --arg touchedFilesJson ./touched-files.json \\\n  --out-link comparison\n\
        \ncat comparison/step-summary.md >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload the comparison results
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      with:
        name: ${{ inputs.artifact-prefix }}comparison
        path: comparison/*
    - name: Add eval summary to commit statuses
      if: ${{ github.event_name == 'pull_request_target' }}
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        script: "const { readFile } = require('node:fs/promises')\nconst changed =\
          \ JSON.parse(await readFile('comparison/changed-paths.json', 'utf-8'))\n\
          const description =\n  'Package: ' + [\n    `added ${changed.attrdiff.added.length}`,\n\
          \    `removed ${changed.attrdiff.removed.length}`,\n    `changed ${changed.attrdiff.changed.length}`\n\
          \  ].join(', ') +\n  ' \u2014 Rebuild: ' + [\n    `linux ${changed.rebuildCountByKernel.linux}`,\n\
          \    `darwin ${changed.rebuildCountByKernel.darwin}`\n  ].join(', ')\n\n\
          const { serverUrl, repo, runId, payload } = context\nconst target_url =\n\
          \  `${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}?pr=${payload.pull_request.number}`\n\
          \nawait github.rest.repos.createCommitStatus({\n  ...repo,\n  sha: payload.pull_request.head.sha,\n\
          \  context: 'Eval Summary',\n  state: 'success',\n  description,\n  target_url\n\
          })\n"
  report:
    runs-on: ubuntu-latest
    needs:
    - versions
    - eval
    steps:
    - name: Download output paths and eval stats for all versions
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
      with:
        pattern: '*-diff-*'
        path: versions
    - name: Add version comparison table to job summary
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      env:
        ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        SYSTEMS: ${{ inputs.systems }}
        VERSIONS: ${{ needs.versions.outputs.versions }}
      with:
        script: "const { readFileSync } = require('node:fs')\nconst path = require('node:path')\n\
          \nconst prefix = process.env.ARTIFACT_PREFIX\nconst systems = JSON.parse(process.env.SYSTEMS)\n\
          const versions = JSON.parse(process.env.VERSIONS)\n\ncore.summary.addHeading('Lix/Nix\
          \ version comparison')\ncore.summary.addTable(\n  [].concat(\n    [\n  \
          \    [{ data: 'Version', header: true }].concat(\n        systems.map((system)\
          \ => ({ data: system, header: true })),\n      ),\n    ],\n    versions.map((version)\
          \ =>\n      [{ data: version }].concat(\n        systems.map((system) =>\
          \ {\n          try {\n            const artifact = path.join('versions',\
          \ `${prefix}${version}-diff-${system}`)\n            const time = Math.round(\n\
          \              parseFloat(\n                readFileSync(\n            \
          \      path.join(artifact, 'after', system, 'total-time'),\n           \
          \       'utf-8',\n                ),\n              ),\n            )\n\
          \            const diff = JSON.parse(\n              readFileSync(path.join(artifact,\
          \ system, 'diff.json'), 'utf-8'),\n            )\n            const attrs\
          \ = []\n              .concat(diff.added, diff.removed, diff.changed, diff.rebuilds)\n\
          \              // There are some special attributes, which are ignored for\
          \ rebuilds.\n              // These only have a single path component, because\
          \ they lack the `.<system>` suffix.\n              .filter((attr) => attr.split('.').length\
          \ > 1)\n            if (attrs.length > 0) {\n              core.setFailed(\n\
          \                `${version} on ${system} has changed outpaths!\\nNote:\
          \ Please make sure to update ci/pinned.json separately from changes to other\
          \ packages.`,\n              )\n              return { data: ':x:' }\n \
          \           }\n            return { data: time }\n          } catch {\n\
          \            core.warning(`${version} on ${system} did not produce artifact.`)\n\
          \            return { data: ':warning:' }\n          }\n        }),\n  \
          \    ),\n    ),\n  ),\n)\ncore.summary.addRaw(\n  '\\n*Evaluation time in\
          \ seconds without downloading dependencies.*',\n  true,\n)\ncore.summary.addRaw('\\\
          n*:warning: Job did not report a result.*', true)\ncore.summary.addRaw(\n\
          \  '\\n*:x: Job produced different outpaths than the target branch.*',\n\
          \  true,\n)\ncore.summary.write()\n"
  misc:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      with:
        persist-credentials: false
        sparse-checkout: .github/actions
    - name: Checkout the merge commit
      uses: ./.github/actions/checkout
      with:
        merged-as-untrusted-at: ${{ inputs.mergedSha }}
    - name: Install Nix
      uses: cachix/install-nix-action@0b0e072294b088b73964f1d72dfdac0951439dbd
    - name: Run misc eval tasks in parallel
      run: '# Ensure flake outputs on all systems still evaluate

        nix flake check --all-systems --no-build ''./nixpkgs/untrusted?shallow=1''
        &

        # Query nixpkgs with aliases enabled to check for basic syntax errors

        nix-env -I ./nixpkgs/untrusted -f ./nixpkgs/untrusted -qa ''*'' --option restrict-eval
        true --option allow-import-from-derivation false >/dev/null &

        wait

        '
