name: Eval
on:
  workflow_dispatch: {}
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  versions:
    if: inputs.testVersions
    runs-on: ubuntu-slim
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      ciPinBumpCommit: ${{ steps.find-pinned-commit.outputs.ciPinBumpCommit }}
      ciPinBumpCommitShort: ${{ steps.find-pinned-commit.outputs.ciPinBumpCommitShort
        }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        path: trusted
        sparse-checkout: 'ci/supportedVersions.nix

          '
    - name: Check out the PR at the test merge commit
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        ref: ${{ inputs.mergedSha }}
        path: untrusted
        sparse-checkout: 'ci/pinned.json

          '
    - name: Find commit that touched ci/pinned.json
      id: find-pinned-commit
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      env:
        TARGET_SHA: ${{ inputs.targetSha }}
        HEAD_SHA: ${{ inputs.headSha }}
      with:
        script: "const targetSha = process.env.TARGET_SHA\nconst headSha = process.env.HEAD_SHA\n\
          \nif (!targetSha || !headSha) {\n  core.setFailed('Error: Both targetSha\
          \ and headSha inputs are required when testVersions is true.')\n  return\n\
          }\n\n// Compare the two commits to get the list of commits in between\n\
          const comparison = await github.rest.repos.compareCommitsWithBasehead({\n\
          \  ...context.repo,\n  basehead: `${targetSha}...${headSha}`,\n})\n\nif(comparison.data.commits.length\
          \ > 50) {\n  core.setFailed('Error: Too many commits in comparison, cannot\
          \ reliably find pinned.json change.')\n  return\n}\n\nconst logRateLimit\
          \ = async (label) => {\n  const { data } = await github.rest.rateLimit.get()\n\
          \  const { remaining, limit, used } = data.rate\n  core.info(`[Rate Limit\
          \ ${label}] ${remaining}/${limit} remaining (${used} used)`)\n}\n\nawait\
          \ logRateLimit('before commit filtering')\n\n// Filter commits that modified\
          \ ci/pinned.json\nconst commitsModifyingPinned = (\n  await Promise.all(\n\
          \    comparison.data.commits.map(async (commit) => {\n      const commitDetails\
          \ = await github.rest.repos.getCommit({\n        ...context.repo,\n    \
          \    ref: commit.sha,\n      })\n      const modifiesPinned = commitDetails.data.files?.some(\n\
          \        (file) => file.filename === \"ci/pinned.json\"\n      )\n     \
          \ return modifiesPinned ? commit.sha : null\n    })\n  )\n).filter((sha)\
          \ => sha !== null)\n\nawait logRateLimit('after commit filtering')\n\nif\
          \ (commitsModifyingPinned.length === 0) {\n  // This should not happen as\
          \ testVersions should only be true\n  // when ci/pinned.json was modified\
          \ in the PR.\n  core.setFailed(\"Error: ci/pinned.json was not modified\
          \ in this PR\")\n  return\n} else if (commitsModifyingPinned.length > 1)\
          \ {\n  core.setFailed([\n    \"Error: Multiple commits touch ci/pinned.json\
          \ in this PR:\",\n    ...commitsModifyingPinned,\n    \"Please ensure only\
          \ a single commit modifies ci/pinned.json for accurate version matrix evaluation.\"\
          \n  ].join(\"\\n\"))\n  return\n}\n\nconst ciPinBumpCommit = commitsModifyingPinned[0]\n\
          core.setOutput(\"ciPinBumpCommit\", ciPinBumpCommit)\ncore.setOutput(\"\
          ciPinBumpCommitShort\", ciPinBumpCommit.substring(0, 7))\ncore.info(`Found\
          \ pinned.json commit: ${ciPinBumpCommit}`)\n"
    - name: Install Nix
      uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15
    - name: Load supported versions
      id: versions
      run: 'echo "versions=$(trusted/ci/supportedVersions.nix --arg pinnedJson untrusted/ci/pinned.json)"
        >> "$GITHUB_OUTPUT"

        '
  eval:
    runs-on: ubuntu-24.04-arm
    needs: versions
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
        version:
        - ''
        - ${{ fromJSON(needs.versions.outputs.versions || '[]') }}
    continue-on-error: ${{ matrix.version != '' }}
    name: ${{ matrix.system }}${{ matrix.version && format(' @ {0} ({1})', matrix.version,
      needs.versions.outputs.ciPinBumpCommitShort) || '' }}
    timeout-minutes: 15
    steps:
    - name: Enable swap
      run: 'sudo fallocate -l 10G /swap

        sudo chmod 600 /swap

        sudo mkswap /swap

        sudo swapon /swap

        '
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        sparse-checkout: .github/actions
    - name: Check out the PR at merged and target commits
      uses: ./.github/actions/checkout
      with:
        merged-as-untrusted-at: ${{ matrix.version && inputs.targetSha || inputs.mergedSha
          }}
        untrusted-pin-bump: ${{ matrix.version && needs.versions.outputs.ciPinBumpCommit
          }}
        target-as-trusted-at: ${{ inputs.targetSha }}
    - name: Install Nix
      uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15
    - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1
      continue-on-error: true
      with:
        name: ${{ vars.CACHIX_NAME || 'nixpkgs-gha' }}
        extraPullNames: nixpkgs-gha
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN_GHA }}
        pushFilter: (-source|-single-chunk)$
    - name: Evaluate the ${{ matrix.system }} output paths at the merge commit
      env:
        MATRIX_SYSTEM: ${{ matrix.system }}
        MATRIX_VERSION: ${{ matrix.version || 'nixVersions.latest' }}
      run: "nix-build nixpkgs/untrusted/ci --arg nixpkgs ./nixpkgs/untrusted-pinned\
        \ -A eval.singleSystem \\\n  --argstr evalSystem \"$MATRIX_SYSTEM\" \\\n \
        \ --arg chunkSize 8000 \\\n  --argstr nixPath \"$MATRIX_VERSION\" \\\n  --out-link\
        \ merged\n# If it uses too much memory, slightly decrease chunkSize.\n# Note:\
        \ Keep the same further down in sync!\n"
    - name: Evaluate the ${{ matrix.system }} output paths at the target commit
      env:
        MATRIX_SYSTEM: ${{ matrix.system }}
      run: "TARGET_DRV=$(nix-instantiate nixpkgs/trusted/ci --arg nixpkgs ./nixpkgs/trusted-pinned\
        \ -A eval.singleSystem \\\n  --argstr evalSystem \"$MATRIX_SYSTEM\" \\\n \
        \ --arg chunkSize 8000 \\\n  --argstr nixPath \"nixVersions.latest\")\n\n\
        # Try to fetch this from Cachix a few times, for up to 30 seconds. This avoids\
        \ running Eval\n# twice in the Merge Queue, when a later item finishes Eval\
        \ at the merge commit earlier.\nfor _i in {1..6}; do\n  # Using --max-jobs\
        \ 0 will cause nix-build to fail if this can't be substituted from cachix.\n\
        \  if nix-build \"$TARGET_DRV\" --max-jobs 0; then\n    break\n  fi\n  sleep\
        \ 5\ndone\n\n# Either fetches from Cachix or runs Eval itself. The fallback\
        \ is required\n# for pull requests into wip-branches without merge queue.\n\
        nix-build \"$TARGET_DRV\" --out-link target\n"
    - name: Compare outpaths against the target branch
      env:
        MATRIX_SYSTEM: ${{ matrix.system }}
      run: "nix-build nixpkgs/untrusted/ci --arg nixpkgs ./nixpkgs/untrusted-pinned\
        \ -A eval.diff \\\n  --arg beforeDir ./target \\\n  --arg afterDir ./merged\
        \ \\\n  --argstr evalSystem \"$MATRIX_SYSTEM\" \\\n  --out-link diff\n"
    - name: Upload outpaths diff and stats
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ${{ inputs.artifact-prefix }}${{ matrix.version && format('{0}-', matrix.version)
          || '' }}diff-${{ matrix.system }}
        path: diff/*
  compare:
    runs-on: ubuntu-24.04-arm
    needs:
    - eval
    if: ${{ !cancelled() && !failure() }}
    permissions:
      pull-requests: write
      statuses: write
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        sparse-checkout: .github/actions
    - name: Check out the PR at the target commit
      uses: ./.github/actions/checkout
      with:
        merged-as-untrusted-at: ${{ inputs.mergedSha }}
        target-as-trusted-at: ${{ inputs.targetSha }}
    - name: Download output paths and eval stats for all systems
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        pattern: ${{ inputs.artifact-prefix }}diff-*
        path: diff
        merge-multiple: true
    - name: Install Nix
      uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15
    - name: Combine all output paths and eval stats
      run: "nix-build nixpkgs/trusted/ci --arg nixpkgs ./nixpkgs/trusted-pinned -A\
        \ eval.combine \\\n  --arg diffDir ./diff \\\n  --out-link combined\n"
    - name: Upload the maintainer list
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ${{ inputs.artifact-prefix }}maintainers
        path: combined/maintainers.json
    - name: Compare against the target branch
      env:
        TARGET_SHA: ${{ inputs.mergedSha }}
      run: "git -C nixpkgs/trusted diff --name-only \"$TARGET_SHA\" \\\n  | jq --raw-input\
        \ --slurp 'split(\"\\n\")[:-1]' > touched-files.json\n\n# Use the target branch\
        \ to get accurate maintainer info\nnix-build nixpkgs/trusted/ci --arg nixpkgs\
        \ ./nixpkgs/trusted-pinned -A eval.compare \\\n  --arg combinedDir ./combined\
        \ \\\n  --arg touchedFilesJson ./touched-files.json \\\n  --out-link comparison\n\
        \ncat comparison/step-summary.md >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Upload the comparison results
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ${{ inputs.artifact-prefix }}comparison
        path: comparison/*
    - name: Add eval summary to commit statuses
      if: ${{ github.event_name == 'pull_request_target' }}
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        script: "const { readFile } = require('node:fs/promises')\nconst changed =\
          \ JSON.parse(await readFile('comparison/changed-paths.json', 'utf-8'))\n\
          const description =\n  'Package: ' + [\n    `added ${changed.attrdiff.added.length}`,\n\
          \    `removed ${changed.attrdiff.removed.length}`,\n    `changed ${changed.attrdiff.changed.length}`\n\
          \  ].join(', ') +\n  ' \u2014 Rebuild: ' + [\n    `linux ${changed.rebuildCountByKernel.linux}`,\n\
          \    `darwin ${changed.rebuildCountByKernel.darwin}`\n  ].join(', ')\n\n\
          const { serverUrl, repo, runId, payload } = context\nconst target_url =\n\
          \  `${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}?pr=${payload.pull_request.number}`\n\
          \nawait github.rest.repos.createCommitStatus({\n  ...repo,\n  sha: payload.pull_request.head.sha,\n\
          \  context: 'Eval Summary',\n  state: 'success',\n  description,\n  target_url\n\
          })\n"
    - name: Request changes if PR is against an inappropriate branch
      if: ${{ github.event_name == 'pull_request_target' }}
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        script: "require('./nixpkgs/trusted/ci/github-script/check-target-branch.js')({\n\
          \  github,\n  context,\n  core,\n  dry: context.eventName == 'pull_request',\n\
          })\n"
  report:
    runs-on: ubuntu-slim
    needs:
    - versions
    - eval
    steps:
    - name: Download output paths and eval stats for all versions
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        pattern: '*-diff-*'
        path: versions
    - name: Add version comparison table to job summary
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      env:
        ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        SYSTEMS: ${{ inputs.systems }}
        VERSIONS: ${{ needs.versions.outputs.versions }}
        CI_PIN_BUMP_COMMIT: ${{ needs.versions.outputs.ciPinBumpCommit }}
      with:
        script: "const { readFileSync } = require('node:fs')\nconst path = require('node:path')\n\
          \nconst prefix = process.env.ARTIFACT_PREFIX\nconst systems = JSON.parse(process.env.SYSTEMS)\n\
          const versions = JSON.parse(process.env.VERSIONS)\nconst ciPinBumpCommit\
          \ = process.env.CI_PIN_BUMP_COMMIT\n\ncore.summary.addHeading('Lix/Nix version\
          \ comparison')\ncore.summary.addRaw(`\\n*Evaluated at commit: \\`${ciPinBumpCommit}\\\
          ` (commit that modified ci/pinned.json)*\\n`, true)\ncore.summary.addTable(\n\
          \  [].concat(\n    [\n      [{ data: 'Version', header: true }].concat(\n\
          \        systems.map((system) => ({ data: system, header: true })),\n  \
          \    ),\n    ],\n    versions.map((version) =>\n      [{ data: version }].concat(\n\
          \        systems.map((system) => {\n          try {\n            const artifact\
          \ = path.join('versions', `${prefix}${version}-diff-${system}`)\n      \
          \      const time = Math.round(\n              parseFloat(\n           \
          \     readFileSync(\n                  path.join(artifact, 'after', system,\
          \ 'total-time'),\n                  'utf-8',\n                ),\n     \
          \         ),\n            )\n            const diff = JSON.parse(\n    \
          \          readFileSync(path.join(artifact, system, 'diff.json'), 'utf-8'),\n\
          \            )\n            const attrs = []\n              .concat(diff.added,\
          \ diff.removed, diff.changed, diff.rebuilds)\n              // There are\
          \ some special attributes, which are ignored for rebuilds.\n           \
          \   // These only have a single path component, because they lack the `.<system>`\
          \ suffix.\n              .filter((attr) => attr.split('.').length > 1)\n\
          \            if (attrs.length > 0) {\n              core.setFailed(\n  \
          \              `${version} on ${system} has changed outpaths!\\n` +\n  \
          \                `Note: This indicates that commit ${ciPinBumpCommit} `\
          \ +\n                  `(which modified ci/pinned.json) also contains other\
          \ ` +\n                  `changes affecting package outputs. ` +\n     \
          \             `Please ensure ci/pinned.json is updated in a standalone commit.`\n\
          \              )\n              return { data: ':x:' }\n            }\n\
          \            return { data: time }\n          } catch {\n            core.warning(`${version}\
          \ on ${system} did not produce artifact.`)\n            return { data: ':warning:'\
          \ }\n          }\n        }),\n      ),\n    ),\n  ),\n)\ncore.summary.addRaw(\n\
          \  '\\n*Evaluation time in seconds without downloading dependencies.*',\n\
          \  true,\n)\ncore.summary.addRaw('\\n*:warning: Job did not report a result.*',\
          \ true)\ncore.summary.addRaw(\n  '\\n*:x: Job produced different outpaths\
          \ than the target branch.*',\n  true,\n)\ncore.summary.write()\n"
  misc:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        sparse-checkout: .github/actions
    - name: Checkout the merge commit
      uses: ./.github/actions/checkout
      with:
        merged-as-untrusted-at: ${{ inputs.mergedSha }}
    - name: Install Nix
      uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15
    - name: Ensure flake outputs on all systems still evaluate
      run: nix flake check --all-systems --no-build './nixpkgs/untrusted?shallow=1'
    - name: Query nixpkgs with aliases enabled to check for basic syntax errors
      run: 'time nix-env -I ./nixpkgs/untrusted -f ./nixpkgs/untrusted -qa ''*'' --option
        restrict-eval true --option allow-import-from-derivation false >/dev/null

        '
    - name: Ensure NixOS modules meta is valid
      run: 'time nix-instantiate -I ./nixpkgs/untrusted --strict --eval --json ./nixpkgs/untrusted/nixos
        --arg configuration ''{}'' --attr config.meta --option restrict-eval true
        --option allow-import-from-derivation false

        '
