name: Eval
on:
  workflow_call:
    inputs:
      mergedSha:
        required: true
        type: string
      targetSha:
        type: string
      systems:
        required: true
        type: string
    secrets:
      OWNER_APP_PRIVATE_KEY:
        required: false
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
    name: ${{ matrix.system }}
    outputs:
      targetRunId: ${{ steps.targetRunId.outputs.targetRunId }}
    steps:
    - name: Enable swap
      run: 'sudo fallocate -l 10G /swap

        sudo chmod 600 /swap

        sudo mkswap /swap

        sudo swapon /swap

        '
    - name: Check out the PR at the test merge commit
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ inputs.mergedSha }}
        path: untrusted
    - name: Install Nix
      uses: cachix/install-nix-action@f0fe604f8a612776892427721526b4c7cfb23aba
      with:
        extra_nix_config: sandbox = true
    - name: Evaluate the ${{ matrix.system }} output paths for all derivation attributes
      env:
        MATRIX_SYSTEM: ${{ matrix.system }}
      run: "nix-build untrusted/ci -A eval.singleSystem \\\n  --argstr evalSystem\
        \ \"$MATRIX_SYSTEM\" \\\n  --arg chunkSize 10000 \\\n  --out-link merged\n\
        # If it uses too much memory, slightly decrease chunkSize\n"
    - name: Upload the output paths and eval stats
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: merged-${{ matrix.system }}
        path: merged/*
    - name: Log current API rate limits
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api /rate_limit | jq
    - name: Get target run id
      if: inputs.targetSha
      id: targetRunId
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      env:
        MATRIX_SYSTEM: ${{ matrix.system }}
        TARGET_SHA: ${{ inputs.targetSha }}
      with:
        script: "const system = process.env.MATRIX_SYSTEM\nconst targetSha = process.env.TARGET_SHA\n\
          \nlet run_id\ntry {\n  run_id = (await github.rest.actions.listWorkflowRuns({\n\
          \    ...context.repo,\n    workflow_id: 'push.yml',\n    event: 'push',\n\
          \    head_sha: targetSha\n  })).data.workflow_runs[0].id\n} catch {\n  throw\
          \ new Error(`Could not find a push.yml workflow run for ${targetSha}.`)\n\
          }\n\n// Waiting 120 * 5 sec = 10 min. max.\n// Eval takes max 5-6 minutes,\
          \ normally.\nfor (let i = 0; i < 120; i++) {\n  const result = await github.rest.actions.listWorkflowRunArtifacts({\n\
          \    ...context.repo,\n    run_id,\n    name: `merged-${system}`\n  })\n\
          \  if (result.data.total_count > 0) {\n    core.setOutput('targetRunId',\
          \ run_id)\n    return\n  }\n  await new Promise(resolve => setTimeout(resolve,\
          \ 5000))\n}\n// No artifact found at this stage. This usually means that\
          \ Eval failed on the target branch.\n// This should only happen when Eval\
          \ is broken on the target branch and this PR fixes it.\n// Continue without\
          \ targetRunId to skip the remaining steps, but pass the job.\n"
    - name: Log current API rate limits
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api /rate_limit | jq
    - uses: actions/download-artifact@v4
      if: steps.targetRunId.outputs.targetRunId
      with:
        run-id: ${{ steps.targetRunId.outputs.targetRunId }}
        name: merged-${{ matrix.system }}
        path: target
        github-token: ${{ github.token }}
        merge-multiple: true
    - name: Compare outpaths against the target branch
      if: steps.targetRunId.outputs.targetRunId
      env:
        MATRIX_SYSTEM: ${{ matrix.system }}
      run: "nix-build untrusted/ci -A eval.diff \\\n  --arg beforeDir ./target \\\n\
        \  --arg afterDir \"$(readlink ./merged)\" \\\n  --argstr evalSystem \"$MATRIX_SYSTEM\"\
        \ \\\n  --out-link diff\n"
    - name: Upload outpaths diff and stats
      if: steps.targetRunId.outputs.targetRunId
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: diff-${{ matrix.system }}
        path: diff/*
  compare:
    runs-on: ubuntu-latest
    needs:
    - eval
    if: needs.eval.outputs.targetRunId
    permissions:
      statuses: write
    steps:
    - name: Download output paths and eval stats for all systems
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
      with:
        pattern: diff-*
        path: diff
        merge-multiple: true
    - name: Check out the PR at the target commit
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ inputs.targetSha }}
        path: trusted
    - name: Install Nix
      uses: cachix/install-nix-action@f0fe604f8a612776892427721526b4c7cfb23aba
      with:
        extra_nix_config: sandbox = true
    - name: Combine all output paths and eval stats
      run: "nix-build trusted/ci -A eval.combine \\\n  --arg diffDir ./diff \\\n \
        \ --out-link combined\n"
    - name: Compare against the target branch
      env:
        AUTHOR_ID: ${{ github.event.pull_request.user.id }}
      run: "git -C trusted fetch --depth 1 origin ${{ inputs.mergedSha }}\ngit -C\
        \ trusted diff --name-only ${{ inputs.mergedSha }} \\\n  | jq --raw-input\
        \ --slurp 'split(\"\\n\")[:-1]' > touched-files.json\n\n# Use the target branch\
        \ to get accurate maintainer info\nnix-build trusted/ci -A eval.compare \\\
        \n  --arg combinedDir \"$(realpath ./combined)\" \\\n  --arg touchedFilesJson\
        \ ./touched-files.json \\\n  --argstr githubAuthorId \"$AUTHOR_ID\" \\\n \
        \ --out-link comparison\n\ncat comparison/step-summary.md >> \"$GITHUB_STEP_SUMMARY\"\
        \n"
    - name: Upload the comparison results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: comparison
        path: comparison/*
    - name: Add eval summary to commit statuses
      if: ${{ github.event_name == 'pull_request_target' }}
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      with:
        script: "const { readFile } = require('node:fs/promises')\nconst changed =\
          \ JSON.parse(await readFile('comparison/changed-paths.json', 'utf-8'))\n\
          const description =\n  'Package: ' + [\n    `added ${changed.attrdiff.added.length}`,\n\
          \    `removed ${changed.attrdiff.removed.length}`,\n    `changed ${changed.attrdiff.changed.length}`\n\
          \  ].join(', ') +\n  ' \u2014 Rebuild: ' + [\n    `linux ${changed.rebuildCountByKernel.linux}`,\n\
          \    `darwin ${changed.rebuildCountByKernel.darwin}`\n  ].join(', ')\n\n\
          const { serverUrl, repo, runId, payload } = context\nconst target_url =\n\
          \  `${serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${runId}?pr=${payload.pull_request.number}`\n\
          \nawait github.rest.repos.createCommitStatus({\n  ...repo,\n  sha: payload.pull_request.head.sha,\n\
          \  context: 'Eval Summary',\n  state: 'success',\n  description,\n  target_url\n\
          })\n"
  misc:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        sparse-checkout: .github/actions
    - name: Check if the PR can be merged and checkout the merge commit
      uses: ./.github/actions/get-merge-commit
      with:
        merged-as-untrusted: true
    - name: Install Nix
      uses: cachix/install-nix-action@f0fe604f8a612776892427721526b4c7cfb23aba
      with:
        extra_nix_config: sandbox = true
    - name: Ensure flake outputs on all systems still evaluate
      run: nix flake check --all-systems --no-build ./untrusted
    - name: Query nixpkgs with aliases enabled to check for basic syntax errors
      run: 'time nix-env -I ./untrusted -f ./untrusted -qa ''*'' --option restrict-eval
        true --option allow-import-from-derivation false >/dev/null

        '
