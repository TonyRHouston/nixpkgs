name: Edited base branch
on:
  pull_request_target:
    types:
    - edited
concurrency:
  group: edited-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number
    || github.run_id }}
  cancel-in-progress: true
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  base:
    name: Trigger jobs
    runs-on: ubuntu-latest
    if: github.event.changes.base.ref.from && github.event.changes.base.ref.from !=
      github.event.pull_request.base.ref
    steps:
    - uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
      id: app-token
      with:
        app-id: ${{ vars.NIXPKGS_CI_APP_ID }}
        private-key: ${{ secrets.NIXPKGS_CI_APP_PRIVATE_KEY }}
        permission-pull-requests: write
    - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        script: "function changeState(state) {\n  return github.rest.pulls.update({\n\
          \    owner: context.repo.owner,\n    repo: context.repo.repo,\n    pull_number:\
          \ context.payload.pull_request.number,\n    state\n  })\n}\nawait changeState('closed')\n\
          await changeState('open')\n"
