name: Edited base branch
on:
  pull_request_target:
    types:
    - edited
permissions: {}
jobs:
  base:
    name: Trigger jobs
    runs-on: ubuntu-latest
    if: github.event.changes.base.ref.from && github.event.changes.base.ref.from !=
      github.event.pull_request.base.ref
    steps:
    - uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
      id: app-token
      with:
        app-id: ${{ vars.NIXPKGS_CI_APP_ID }}
        private-key: ${{ secrets.NIXPKGS_CI_APP_PRIVATE_KEY }}
        permission-pull-requests: write
    - env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        REPOSITORY: ${{ github.repository }}
        NUMBER: ${{ github.event.number }}
      run: "gh api \\\n  --method PATCH \\\n  /repos/\"$REPOSITORY\"/pulls/\"$NUMBER\"\
        \ \\\n  -f \"state=closed\"\ngh api \\\n  --method PATCH \\\n  /repos/\"$REPOSITORY\"\
        /pulls/\"$NUMBER\" \\\n  -f \"state=open\"\n"
