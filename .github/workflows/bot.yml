name: Bot
on:
  workflow_dispatch: {}
concurrency:
  group: bot-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number
    }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
permissions:
  issues: write
  pull-requests: write
defaults:
  run:
    shell: bash
jobs:
  run:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository_owner == 'NixOS'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        sparse-checkout: 'ci/github-script

          '
    - name: Install dependencies
      run: npm install @actions/artifact@5.0.3 bottleneck
    - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf
      if: github.event_name != 'pull_request' && vars.NIXPKGS_CI_APP_ID
      id: app-token
      with:
        app-id: ${{ vars.NIXPKGS_CI_APP_ID }}
        private-key: ${{ secrets.NIXPKGS_CI_APP_PRIVATE_KEY }}
        permission-administration: read
        permission-contents: write
        permission-issues: write
        permission-members: read
        permission-pull-requests: write
    - name: Log current API rate limits
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: gh api /rate_limit | jq
    - name: Run bot
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        github-token: ${{ steps.app-token.outputs.token || github.token }}
        retries: 3
        script: "require('./ci/github-script/bot.js')({\n  github,\n  context,\n \
          \ core,\n  dry: context.eventName == 'pull_request'\n})\n"
    - name: Log current API rate limits
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: gh api /rate_limit | jq
    - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b
      name: Labels from touched files
      if: 'github.event_name == ''pull_request_target'' &&

        !contains(fromJSON(inputs.headBranch).type, ''development'')

        '
      with:
        repo-token: ${{ steps.app-token.outputs.token || github.token }}
        configuration-path: .github/labeler.yml
        sync-labels: true
    - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b
      name: Labels from touched files (no sync)
      if: 'github.event_name == ''pull_request_target'' &&

        !contains(fromJSON(inputs.headBranch).type, ''development'')

        '
      with:
        repo-token: ${{ steps.app-token.outputs.token || github.token }}
        configuration-path: .github/labeler-no-sync.yml
        sync-labels: false
    - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b
      name: Labels from touched files (development branches)
      if: 'github.event_name == ''pull_request_target'' &&

        contains(fromJSON(inputs.headBranch).type, ''development'')

        '
      with:
        repo-token: ${{ steps.app-token.outputs.token || github.token }}
        configuration-path: .github/labeler-development-branches.yml
        sync-labels: true
    - name: Log current API rate limits
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
      run: gh api /rate_limit | jq
