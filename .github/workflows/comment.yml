name: Comment
on:
  workflow_dispatch: {}
permissions:
  pull-requests: write
defaults:
  run:
    shell: bash
jobs:
  react:
    name: React with eyes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: contains(github.event.comment.body, '@NixOS/nixpkgs-merge-bot merge')
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
        sparse-checkout: 'ci/github-script

          '
    - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf
      if: github.event_name != 'pull_request' && vars.NIXPKGS_CI_APP_ID
      id: app-token
      with:
        app-id: ${{ vars.NIXPKGS_CI_APP_ID }}
        private-key: ${{ secrets.NIXPKGS_CI_APP_PRIVATE_KEY }}
        permission-pull-requests: write
    - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      with:
        github-token: ${{ steps.app-token.outputs.token || github.token }}
        retries: 3
        script: "const { handleMergeComment } = require('./ci/github-script/merge.js')\n\
          const { body, node_id } = context.payload.comment\n\nawait handleMergeComment({\n\
          \  github,\n  body,\n  node_id,\n  reaction: 'EYES',\n})\n"
