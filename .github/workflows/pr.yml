name: PR
on:
  pull_request:
    paths:
    - .github/workflows/build.yml
    - .github/workflows/check.yml
    - .github/workflows/eval.yml
    - .github/workflows/lint.yml
    - .github/workflows/pr.yml
    - .github/workflows/labels.yml
    - .github/workflows/reviewers.yml
  pull_request_target: null
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number
    || github.run_id }}
  cancel-in-progress: true
permissions: {}
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      baseBranch: ${{ steps.branches.outputs.base }}
      headBranch: ${{ steps.branches.outputs.head }}
      mergedSha: ${{ steps.get-merge-commit.outputs.mergedSha }}
      targetSha: ${{ steps.get-merge-commit.outputs.targetSha }}
      systems: ${{ steps.systems.outputs.systems }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        sparse-checkout: '.github/actions

          ci/supportedBranches.js

          ci/supportedSystems.json

          '
    - name: Check if the PR can be merged and get the test merge commit
      uses: ./.github/actions/get-merge-commit
      id: get-merge-commit
    - name: Load supported systems
      id: systems
      run: 'echo "systems=$(jq -c <ci/supportedSystems.json)" >> "$GITHUB_OUTPUT"

        '
    - name: Determine branch type
      id: branches
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      with:
        script: "const { classify } = require('./ci/supportedBranches.js')\nconst\
          \ { base, head } = context.payload.pull_request\n\nconst baseClassification\
          \ = classify(base.ref)\ncore.setOutput('base', baseClassification)\ncore.info('base\
          \ classification:', baseClassification)\n\nconst headClassification =\n\
          \  (base.repo.full_name == head.repo.full_name) ?\n  classify(head.ref)\
          \ :\n  // PRs from forks are always considered WIP.\n  { type: ['wip'] }\n\
          core.setOutput('head', headClassification)\ncore.info('head classification:',\
          \ headClassification)\n"
  check:
    name: Check
    needs:
    - prepare
    uses: ./.github/workflows/check.yml
    permissions:
      pull-requests: write
    with:
      baseBranch: ${{ needs.prepare.outputs.baseBranch }}
      headBranch: ${{ needs.prepare.outputs.headBranch }}
  lint:
    name: Lint
    needs:
    - prepare
    uses: ./.github/workflows/lint.yml
    with:
      mergedSha: ${{ needs.prepare.outputs.mergedSha }}
      targetSha: ${{ needs.prepare.outputs.targetSha }}
  eval:
    name: Eval
    needs:
    - prepare
    uses: ./.github/workflows/eval.yml
    permissions:
      statuses: write
    secrets:
      OWNER_APP_PRIVATE_KEY: ${{ secrets.OWNER_APP_PRIVATE_KEY }}
    with:
      mergedSha: ${{ needs.prepare.outputs.mergedSha }}
      targetSha: ${{ needs.prepare.outputs.targetSha }}
      systems: ${{ needs.prepare.outputs.systems }}
  labels:
    name: Labels
    needs:
    - prepare
    - eval
    uses: ./.github/workflows/labels.yml
    permissions:
      issues: write
      pull-requests: write
    secrets:
      NIXPKGS_CI_APP_PRIVATE_KEY: ${{ secrets.NIXPKGS_CI_APP_PRIVATE_KEY }}
    with:
      headBranch: ${{ needs.prepare.outputs.headBranch }}
  reviewers:
    name: Reviewers
    needs:
    - prepare
    - eval
    if: 'needs.prepare.outputs.targetSha &&

      !contains(fromJSON(needs.prepare.outputs.headBranch).type, ''development'')

      '
    uses: ./.github/workflows/reviewers.yml
    secrets:
      OWNER_APP_PRIVATE_KEY: ${{ secrets.OWNER_APP_PRIVATE_KEY }}
  build:
    name: Build
    needs:
    - prepare
    uses: ./.github/workflows/build.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    with:
      baseBranch: ${{ needs.prepare.outputs.baseBranch }}
      mergedSha: ${{ needs.prepare.outputs.mergedSha }}
  no-pr-failures:
    needs:
    - check
    - lint
    - eval
    - build
    name: no PR failures
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
    - run: exit 1
