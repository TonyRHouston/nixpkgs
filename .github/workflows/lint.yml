name: Lint
on:
  workflow_call:
    inputs:
      mergedSha:
        required: true
        type: string
      targetSha:
        required: true
        type: string
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  treefmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        sparse-checkout: .github/actions
    - name: Check if the PR can be merged and checkout the merge commit
      uses: ./.github/actions/get-merge-commit
      with:
        mergedSha: ${{ inputs.mergedSha }}
        merged-as-untrusted: true
    - uses: cachix/install-nix-action@f0fe604f8a612776892427721526b4c7cfb23aba
      with:
        extra_nix_config: sandbox = true
    - name: Check that files are formatted
      run: "# Note that it's fine to run this on untrusted code because:\n# - There's\
        \ no secrets accessible here\n# - The build is sandboxed\nif ! nix-build untrusted/ci\
        \ -A fmt.check; then\n  echo \"Some files are not properly formatted\"\n \
        \ echo \"Please format them by going to the Nixpkgs root directory and running\
        \ one of:\"\n  echo \"  nix-shell --run treefmt\"\n  echo \"  nix develop\
        \ --command treefmt\"\n  echo \"  nix fmt\"\n  echo \"Make sure your branch\
        \ is up to date with master; rebase if not.\"\n  echo \"If you're having trouble,\
        \ please ping @NixOS/nix-formatting\"\n  exit 1\nfi\n"
  parse:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        sparse-checkout: .github/actions
    - name: Check if the PR can be merged and checkout the merge commit
      uses: ./.github/actions/get-merge-commit
      with:
        mergedSha: ${{ inputs.mergedSha }}
        merged-as-untrusted: true
    - uses: cachix/install-nix-action@f0fe604f8a612776892427721526b4c7cfb23aba
      with:
        extra_nix_config: sandbox = true
    - name: Parse all nix files
      run: '# Tests multiple versions at once, let''s make sure all of them run, so
        keep-going.

        nix-build untrusted/ci -A parse --keep-going

        '
  nixpkgs-vet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        sparse-checkout: .github/actions
    - name: Check if the PR can be merged and checkout merged and target commits
      uses: ./.github/actions/get-merge-commit
      with:
        mergedSha: ${{ inputs.mergedSha }}
        merged-as-untrusted: true
        targetSha: ${{ inputs.targetSha }}
        target-as-trusted: true
    - uses: cachix/install-nix-action@f0fe604f8a612776892427721526b4c7cfb23aba
      with:
        extra_nix_config: sandbox = true
    - name: Running nixpkgs-vet
      env:
        CLICOLOR_FORCE: 1
      run: "if nix-build untrusted/ci -A nixpkgs-vet --arg base \"./trusted\" --arg\
        \ head \"./untrusted\"; then\n  exit 0\nelse\n  exitCode=$?\n  echo \"To run\
        \ locally: ./ci/nixpkgs-vet.sh $GITHUB_BASE_REF https://github.com/$GITHUB_REPOSITORY.git\"\
        \n  echo \"If you're having trouble, ping @NixOS/nixpkgs-vet\"\n  exit \"\
        $exitCode\"\nfi\n"
